<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your saved favourites on Hanime AG.">
  <title>Favourites — Hanime AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar" role="banner">
  <a href="index.html" class="back-btn" aria-label="Back to home">
    <i class="fa-solid fa-arrow-left"></i>
  </a>
  <div class="search-box" role="search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Search favourites…" aria-label="Search favourites">
  </div>
  <a href="account.html" class="profile-btn" aria-label="My account">
    <i class="fa-solid fa-circle-user"></i>
  </a>
</header>

<main class="page-content" role="main">
  <h1><i class="fa-solid fa-heart" style="color:var(--accent);margin-right:10px;font-size:20px"></i>Favourites</h1>

  <div class="empty-state" id="emptyFav">
    <i class="fa-regular fa-heart"></i>
    <h3>No favourites yet</h3>
    <p>Tap the ♥ on any title to save it here.<br>Your collection will appear on this page.</p>
  </div>

  <div class="movie-grid" id="favGrid" style="display:none"></div>
</main>

<script src="app.js"></script>
<script>
  const favGrid  = document.getElementById('favGrid');
  const emptyFav = document.getElementById('emptyFav');
  const saved    = JSON.parse(localStorage.getItem('hag_favourites') || '[]');
  if (saved.length) {
    emptyFav.style.display = 'none';
    favGrid.style.display  = 'grid';
    saved.forEach(item => {
      const a = document.createElement('a');
      a.href      = item.url  || 'watch.html';
      a.className = 'movie-card';
      a.innerHTML = `<div class="card-thumb"><img src="${item.img||'https://picsum.photos/seed/hagfav/300/420'}" alt="${item.title}" loading="lazy"><div class="card-play-overlay"><i class="fa-solid fa-circle-play"></i></div></div><h3>${item.title}</h3>`;
      favGrid.appendChild(a);
    });
  }
</script>
</body>
</html>
