<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Hanime AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar" role="banner">
  <a href="index.html" class="back-btn" aria-label="Back to home">
    <i class="fa-solid fa-arrow-left"></i>
  </a>
  <h2>My Account</h2>
  <div style="width:38px"></div>
</header>

<main class="page-content" role="main">

  <!-- ── Signed-in view ───────────────────────────────────── -->
  <div id="signedInView" hidden>
    <div class="account-card">

      <!-- Avatar -->
      <div class="profile-avatar" id="accountAvatar" aria-hidden="true">
        <i class="fa-solid fa-user"></i>
      </div>

      <h2 id="accountName">Loading…</h2>
      <p id="accountEmail" style="color:var(--text-sub);font-size:13px;margin-bottom:6px"></p>
      <span class="account-badge" id="accountBadge">Free Member</span>

      <nav class="account-menu" aria-label="Account navigation" style="margin-top:24px">
        <a href="favorite.html" class="account-item">
          <i class="fa-solid fa-heart"></i> Favourites
        </a>
        <a href="history.html" class="account-item">
          <i class="fa-solid fa-clock-rotate-left"></i> Watch History
        </a>
        <a href="trending.html" class="account-item">
          <i class="fa-solid fa-fire-flame-curved"></i> Trending
        </a>
        <a href="movies.html" class="account-item">
          <i class="fa-solid fa-film"></i> Movies
        </a>
        <a href="series.html" class="account-item">
          <i class="fa-solid fa-tv"></i> Series
        </a>
        <a href="gallery.html" class="account-item">
          <i class="fa-solid fa-images"></i> Gallery
        </a>
      </nav>

      <button class="auth-btn-signout" id="signOutBtn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
      </button>

    </div>
  </div>

  <!-- ── Guest view ────────────────────────────────────────── -->
  <div id="guestView" hidden>
    <div class="account-card">
      <div class="profile-avatar" aria-hidden="true">
        <i class="fa-solid fa-user"></i>
      </div>
      <h2>Guest User</h2>
      <p>Sign in for the full Hanime AG experience</p>

      <div class="auth-cta-btns">
        <a href="login.html?returnTo=account.html" class="auth-btn-cta">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </a>
        <a href="signup.html" class="auth-btn-cta auth-btn-cta-outline">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </a>
      </div>

      <nav class="account-menu" aria-label="Account navigation" style="margin-top:24px">
        <a href="trending.html" class="account-item">
          <i class="fa-solid fa-fire-flame-curved"></i> Trending
        </a>
        <a href="movies.html" class="account-item">
          <i class="fa-solid fa-film"></i> Movies
        </a>
        <a href="series.html" class="account-item">
          <i class="fa-solid fa-tv"></i> Series
        </a>
        <a href="gallery.html" class="account-item">
          <i class="fa-solid fa-images"></i> Gallery
        </a>
        <a href="index.html" class="account-item">
          <i class="fa-solid fa-house"></i> Home
        </a>
      </nav>
    </div>
  </div>

</main>

<script src="app.js"></script>
<script type="module">
  import { auth, logOut, onAuthStateChanged } from './auth.js';

  function getInitials(name) {
    if (!name) return '?';
    const p = name.trim().split(/\s+/);
    return p.length >= 2 ? (p[0][0] + p[1][0]).toUpperCase() : name.substring(0,2).toUpperCase();
  }

  onAuthStateChanged(auth, user => {
    if (user) {
      // Show signed-in view
      document.getElementById('signedInView').hidden = false;
      document.getElementById('guestView').hidden = true;

      // Avatar
      const avatarEl = document.getElementById('accountAvatar');
      if (user.photoURL) {
        avatarEl.innerHTML = `<img src="${user.photoURL}" alt="${user.displayName || 'Profile'}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" referrerpolicy="no-referrer">`;
        avatarEl.style.background = 'none';
        avatarEl.style.border = '2px solid var(--accent)';
      } else {
        avatarEl.innerHTML = `<span style="font-size:30px;font-weight:800;color:var(--accent)">${getInitials(user.displayName || user.email)}</span>`;
        avatarEl.style.background = 'rgba(255,107,0,.1)';
        avatarEl.style.border = '2px solid rgba(255,107,0,.35)';
      }

      document.getElementById('accountName').textContent  = user.displayName || 'Anime Fan';
      document.getElementById('accountEmail').textContent = user.email || '';

      // Badge: Google users get a "Google Account" label
      if (user.providerData?.[0]?.providerId === 'google.com') {
        document.getElementById('accountBadge').textContent = 'Google Account';
      }
    } else {
      document.getElementById('signedInView').hidden = true;
      document.getElementById('guestView').hidden = false;
    }
  });

  document.getElementById('signOutBtn')?.addEventListener('click', async () => {
    try {
      await logOut();
      window.location.href = 'index.html';
    } catch (e) {
      console.error('[HAG] Sign out error:', e);
    }
  });
</script>
</body>
</html>
