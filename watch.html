<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Watch anime episodes on Hanime AG.">
  <title>Watch — Hanime AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar" role="banner">
  <a href="javascript:history.back()" class="back-btn" aria-label="Go back">
    <i class="fa-solid fa-arrow-left"></i>
  </a>
  <h2>Hanime AG</h2>
  <a href="account.html" class="profile-btn" aria-label="My account">
    <i class="fa-solid fa-circle-user"></i>
  </a>
</header>

<main class="watch-page" role="main">

  <!-- Video Player: source and episode metadata come from episodes.json. -->
  <div class="video-container" id="videoContainer">
    <video id="videoPlayer" controls playsinline preload="metadata" aria-label="Anime episode video"></video>
    <div class="video-state" id="videoState" role="status" aria-live="polite">
      <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
      <p>Loading episode…</p>
    </div>
  </div>

  <!-- Info -->
  <div class="watch-info">
    <p class="watch-series-name" id="watchSeriesLabel">Now Watching</p>
    <div class="watch-title-row">
      <h1 class="watch-title" id="watchTitle">Solo Leveling</h1>
      <button class="watch-fav-btn" id="watchFavBtn" aria-label="Add to favourites">
        <i class="fa-regular fa-heart"></i>
      </button>
    </div>
    <p class="watch-episode-label" id="epLabel">Episode 1</p>
    <p class="watch-desc" id="watchDesc">Choose an episode to start watching.</p>
  </div>

  <!-- Navigation Buttons -->
  <div class="watch-actions">
    <button class="btn-prev-ep" id="btnPrev" aria-label="Previous episode">
      <i class="fa-solid fa-backward-step"></i> Previous
    </button>
    <button class="btn-next-ep" id="btnNext" aria-label="Next episode">
      Next <i class="fa-solid fa-forward-step"></i>
    </button>
  </div>

  <!-- Episode List -->
  <div class="episode-section">
    <h3 class="episode-section-title" id="episodeSectionTitle">Episodes — Season 1</h3>
    <div id="episodeList" aria-label="Episodes"></div>
  </div>

</main>

<script src="app.js"></script>
<script src="anime-images.js"></script>
<script type="module" src="auth-ui.js"></script>
<script src="footer.js"></script>

<script type="module">
  import { auth, onAuthStateChanged } from './auth.js';
  import { addFavourite, removeFavourite, getFavouriteSlugs, addToHistory, buildFavouriteRecord } from './favorites-client.js';

  // ── Slug → title map (compact) ──────────────────────────
  const TITLES = {
    'solo-leveling':          'Solo Leveling',
    'jujutsu-kaisen':         'Jujutsu Kaisen',
    'demon-slayer':           'Demon Slayer',
    'attack-on-titan':        'Attack on Titan',
    'vinland-saga':           'Vinland Saga',
    'bleach-tybw':            'Bleach: TYBW',
    'chainsaw-man':           'Chainsaw Man',
    'overflow':               'Overflow',
    'your-name':              'Your Name',
    'suzume':                 'Suzume',
    'a-silent-voice':         'A Silent Voice',
    'spirited-away':          'Spirited Away',
    'princess-mononoke':      'Princess Mononoke',
    'one-piece':              'One Piece',
    'naruto-shippuden':       'Naruto Shippuden',
    'my-hero-academia':       'My Hero Academia',
    'weathering-with-you':    'Weathering with You',
  };

  // ── Read slug from URL ──────────────────────────────────
  const params = new URLSearchParams(location.search);
  const slug  = params.get('slug') || 'solo-leveling';
  const requestedEpisode = Number.parseInt(params.get('episode') || '1', 10);
  const title = TITLES[slug] || slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  document.getElementById('watchTitle').textContent = title;
  document.title = `${title} — Hanime AG`;

  // ── Auth state: fav button + history ───────────────────
  let _user = null;
  let _isFav = false;

  const favBtn = document.getElementById('watchFavBtn');

  onAuthStateChanged(auth, async user => {
    _user = user;
    if (user) {
      try {
        const slugSet = await getFavouriteSlugs(user.uid);
        _isFav = slugSet.has(slug);
        updateFavBtn();
      } catch (_) {}
    } else {
      _isFav = false;
      updateFavBtn();
    }
  });

  function updateFavBtn() {
    favBtn.innerHTML = _isFav
      ? '<i class="fa-solid fa-heart" style="color:var(--accent)"></i>'
      : '<i class="fa-regular fa-heart"></i>';
    favBtn.setAttribute('aria-label', _isFav ? 'Remove from favourites' : 'Add to favourites');
  }

  favBtn.addEventListener('click', async () => {
    if (!_user) {
      window._hagToast?.('Sign in to save favourites ✨');
      setTimeout(() => { window.location.href = `login?returnTo=${encodeURIComponent(location.pathname + location.search)}`; }, 900);
      return;
    }
    const wasOn = _isFav;
    _isFav = !wasOn;
    updateFavBtn();
    try {
      if (wasOn) {
        await removeFavourite(_user.uid, slug);
        window._hagToast?.('Removed from favourites');
      } else {
        await addFavourite(_user.uid, slug, { title });
        window._hagToast?.('Added to favourites ❤');
      }
    } catch (err) {
      console.error('[HAG] Fav error:', err);
      _isFav = wasOn;
      updateFavBtn();
    }
  });

  // ── Manifest-driven player ─────────────────────────────
  const video = document.getElementById('videoPlayer');
  const videoState = document.getElementById('videoState');
  const episodeList = document.getElementById('episodeList');
  const epLabel = document.getElementById('epLabel');
  const watchDesc = document.getElementById('watchDesc');
  const sectionTitle = document.getElementById('episodeSectionTitle');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  let manifestEntry = null;
  let episodes = [];
  let currentEpisode = 1;
  let historyLogged = false;

  function showVideoState(message, icon = 'fa-circle-exclamation', action = '') {
    videoState.innerHTML = `<i class="fa-solid ${icon}" aria-hidden="true"></i><p>${message}</p>${action}`;
    videoState.style.display = 'flex';
  }

  function clearVideo() {
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.style.display = 'none';
  }

  function episodeFor(number) {
    return episodes.find(ep => ep.episodeNumber === number) || null;
  }

  function updateUrl(number) {
    const next = new URL(location.href);
    next.pathname = next.pathname.replace(/\/?watch(?:\.html)?$/, '/watch');
    next.searchParams.set('slug', slug);
    next.searchParams.set('episode', String(number));
    history.replaceState({ slug, episode: number }, '', next);
  }

  function renderEpisodeList() {
    episodeList.innerHTML = episodes.map(ep => `
      <button type="button" class="episode-item${ep.episodeNumber === currentEpisode ? ' active' : ''}"
              data-episode="${ep.episodeNumber}" aria-pressed="${ep.episodeNumber === currentEpisode}">
        <span class="ep-num">Ep ${ep.episodeNumber}</span>
        <span class="ep-info"><h4>${ep.title || `Episode ${ep.episodeNumber}`}</h4><span class="ep-dur">${ep.duration || 'Duration unavailable'}</span></span>
        <i class="fa-${ep.episodeNumber === currentEpisode ? 'solid' : 'regular'} fa-circle-play ep-play" aria-hidden="true"></i>
      </button>`).join('');

    episodeList.querySelectorAll('[data-episode]').forEach(item => {
      item.addEventListener('click', () => loadEpisode(Number(item.dataset.episode), true));
    });
  }

  function updateEpisodeControls() {
    document.querySelectorAll('.episode-item').forEach(item => {
      const active = Number(item.dataset.episode) === currentEpisode;
      item.classList.toggle('active', active);
      item.setAttribute('aria-pressed', String(active));
      const icon = item.querySelector('.ep-play');
      if (icon) icon.className = `fa-${active ? 'solid' : 'regular'} fa-circle-play ep-play`;
    });
    epLabel.textContent = `Episode ${currentEpisode}${episodeFor(currentEpisode)?.title ? ` — ${episodeFor(currentEpisode).title}` : ''}`;
    btnPrev.disabled = currentEpisode <= 1;
    btnNext.disabled = currentEpisode >= episodes.length;
  }

  function logHistory() {
    if (!_user || historyLogged) return;
    historyLogged = true;
    buildFavouriteRecord(slug, { title }).then(record =>
      addToHistory(_user.uid, slug, {
        title: record.title,
        img: record.cover,
        url: `watch?slug=${encodeURIComponent(slug)}&episode=${currentEpisode}`
      })
    ).catch(error => console.error('[HAG] History error:', error));
  }

  function loadEpisode(number, autoplay = false) {
    const episode = episodeFor(number);
    if (!episode) return;
    currentEpisode = number;
    updateUrl(number);
    updateEpisodeControls();
    clearVideo();
    videoState.style.display = 'none';

    if (!episode.videoUrl) {
      showVideoState('Video unavailable', 'fa-video-slash');
      watchDesc.textContent = 'This episode does not have a streaming source yet.';
      return;
    }

    watchDesc.textContent = episode.server ? `Streaming from ${episode.server}.` : 'Ready to play.';
    video.type = episode.type || (String(episode.videoUrl).includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4');
    video.src = episode.videoUrl;
    video.style.display = 'block';
    video.load();
    if (autoplay) video.play().catch(() => {});
    logHistory();
  }

  async function loadManifest() {
    try {
      const response = await fetch('episodes.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Manifest request failed: ${response.status}`);
      const manifest = await response.json();
      manifestEntry = manifest.anime?.[slug] || null;
      if (!manifestEntry) {
        episodes = [];
        episodeList.innerHTML = '<p class="video-manifest-message">No episodes are configured for this title.</p>';
        clearVideo();
        showVideoState('Video unavailable', 'fa-video-slash');
        btnPrev.disabled = true;
        btnNext.disabled = true;
        return;
      }

      const configured = Array.isArray(manifestEntry.episodes) ? manifestEntry.episodes : [];
      const episodeCount = manifestEntry.episodeCount || configured.length || 1;
      const byNumber = new Map(configured.map(ep => [Number(ep.episodeNumber), ep]));
      episodes = Array.from({ length: episodeCount }, (_, index) => ({
        episodeNumber: index + 1,
        title: `Episode ${index + 1}`,
        duration: null,
        thumbnail: null,
        videoUrl: null,
        subtitles: [],
        quality: [],
        server: null,
        ...(byNumber.get(index + 1) || {})
      }));
      currentEpisode = Math.min(Math.max(Number.isFinite(requestedEpisode) ? requestedEpisode : 1, 1), episodes.length);
      sectionTitle.textContent = `Episodes — Season ${manifestEntry.season || 1}`;
      renderEpisodeList();
      updateEpisodeControls();
      loadEpisode(currentEpisode);
      if (manifestEntry.title) {
        document.getElementById('watchTitle').textContent = manifestEntry.title;
        document.title = `${manifestEntry.title} — Hanime AG`;
      }
    } catch (error) {
      console.error('[HAG] Episode manifest error:', error);
      episodes = [];
      episodeList.innerHTML = '<p class="video-manifest-message">Episode data could not be loaded.</p>';
      clearVideo();
      showVideoState('Video unavailable', 'fa-video-slash');
    }
  }

  btnPrev.addEventListener('click', () => {
    if (currentEpisode > 1) loadEpisode(currentEpisode - 1, true);
  });
  btnNext.addEventListener('click', () => {
    if (currentEpisode < episodes.length) loadEpisode(currentEpisode + 1, true);
  });
  video.addEventListener('error', () => {
    video.style.display = 'none';
    showVideoState('Video unavailable', 'fa-video-slash', '<button type="button" class="video-retry" id="videoRetry">Retry</button>');
    document.getElementById('videoRetry')?.addEventListener('click', () => loadEpisode(currentEpisode, true));
  });
  video.addEventListener('ended', () => {
    if (currentEpisode < episodes.length) loadEpisode(currentEpisode + 1, true);
  });

  loadManifest();
</script>
</body>
</html>
