<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Hanime AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <a href="index.html" class="auth-logo">
      <div class="logo-icon">H</div>
      <span>Hanime AG</span>
    </a>

    <div class="auth-icon-badge">
      <i class="fa-solid fa-key"></i>
    </div>

    <h1 class="auth-title">Reset password</h1>
    <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>

    <div class="auth-alert auth-alert-error"   id="authError"   hidden></div>
    <div class="auth-alert auth-alert-success"  id="authSuccess" hidden></div>

    <form class="auth-form" id="resetForm" novalidate>
      <div class="auth-input-group">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" class="auth-input" placeholder="you@example.com"
               autocomplete="email" required>
      </div>

      <button type="submit" class="auth-btn" id="resetBtn">
        <span class="auth-btn-label">Send Reset Email</span>
        <span class="auth-spinner" hidden><i class="fa-solid fa-circle-notch fa-spin"></i></span>
      </button>
    </form>

    <p class="auth-link-row" style="margin-top:24px">
      <a href="login.html" class="auth-back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Sign In
      </a>
    </p>

  </div>
</div>

<script type="module">
  import { resetPassword, friendlyError } from './auth.js';

  function showError(msg) {
    document.getElementById('authError').textContent = msg;
    document.getElementById('authError').hidden = false;
    document.getElementById('authSuccess').hidden = true;
  }
  function showSuccess(msg) {
    document.getElementById('authSuccess').textContent = msg;
    document.getElementById('authSuccess').hidden = false;
    document.getElementById('authError').hidden = true;
  }
  function setLoading(on) {
    const btn = document.getElementById('resetBtn');
    btn.disabled = on;
    btn.querySelector('.auth-btn-label').hidden = on;
    btn.querySelector('.auth-spinner').hidden = !on;
  }

  document.getElementById('resetForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) { showError('Please enter your email address.'); return; }
    setLoading(true);
    try {
      await resetPassword(email);
      showSuccess('Reset link sent! Check your inbox (and spam folder).');
      document.getElementById('resetForm').reset();
    } catch (err) {
      showError(friendlyError(err.code));
    } finally {
      setLoading(false);
    }
  });
</script>
<script src="footer.js"></script>
</body>
</html>
