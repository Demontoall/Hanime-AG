<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Hanime AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <a href="index.html" class="auth-logo">
      <div class="logo-icon">H</div>
      <span>Hanime AG</span>
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <div class="auth-alert auth-alert-error" id="authError" hidden></div>

    <form class="auth-form" id="loginForm" novalidate>
      <div class="auth-input-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" class="auth-input" placeholder="you@example.com"
               autocomplete="email" required>
      </div>
      <div class="auth-input-group">
        <label for="loginPassword">Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••"
                 autocomplete="current-password" required>
          <button type="button" class="auth-eye" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="auth-row">
        <a href="forgot-password.html" class="auth-link-sm">Forgot password?</a>
      </div>

      <button type="submit" class="auth-btn" id="loginBtn">
        <span class="auth-btn-label">Sign In</span>
        <span class="auth-spinner" hidden><i class="fa-solid fa-circle-notch fa-spin"></i></span>
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button class="auth-btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-link-row">
      Don't have an account? <a href="signup.html">Create one</a>
    </p>

  </div>
</div>

<script type="module">
  import { loginWithEmail, loginWithGoogle, handleGoogleRedirect, auth, onAuthStateChanged, friendlyError } from './auth.js';

  function returnTo() {
    return new URLSearchParams(location.search).get('returnTo') || '';
  }
  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.hidden = false;
  }
  function clearError() {
    const el = document.getElementById('authError');
    el.hidden = true;
    el.textContent = '';
  }
  function setLoading(on) {
    const btn = document.getElementById('loginBtn');
    btn.disabled = on;
    btn.querySelector('.auth-btn-label').hidden = on;
    btn.querySelector('.auth-spinner').hidden  = !on;
    document.getElementById('googleBtn').disabled = on;
  }

  // Handle Google redirect result on page load (fires after returning from Google).
  // onAuthStateChanged below handles the actual redirect to home once signed in.
  handleGoogleRedirect().catch(err => {
    showError(friendlyError(err.code));
  });

  // If already signed in (or just completed Google redirect), go to returnTo or home
  onAuthStateChanged(auth, user => {
    if (user) window.location.replace(returnTo() || 'index.html');
  });

  // Toggle password visibility
  document.querySelector('.auth-eye').addEventListener('click', function () {
    const inp = document.getElementById('loginPassword');
    const icon = this.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'fa-regular fa-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'fa-regular fa-eye';
    }
  });

  // Email / password sign-in
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    clearError();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) { showError('Please fill in all fields.'); return; }
    setLoading(true);
    try {
      await loginWithEmail(email, password);
      window.location.replace(returnTo() || 'index.html');
    } catch (err) {
      showError(friendlyError(err.code));
      setLoading(false);
    }
  });

  // Google sign-in — tries popup, falls back to redirect if popup is blocked
  document.getElementById('googleBtn').addEventListener('click', async () => {
    clearError();
    setLoading(true);
    try {
      const user = await loginWithGoogle();
      // user is null when a redirect was initiated — page is navigating away
      if (user) window.location.replace(returnTo() || 'index.html');
    } catch (err) {
      showError(friendlyError(err.code));
      setLoading(false);
    }
  });
</script>
<script src="footer.js"></script>
</body>
</html>
