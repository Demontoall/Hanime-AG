<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Hanime AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <a href="index.html" class="auth-logo">
      <div class="logo-icon">H</div>
      <span>Hanime AG</span>
    </a>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Join for free and save your favourites</p>

    <div class="auth-alert auth-alert-error" id="authError" hidden></div>
    <div class="auth-alert auth-alert-success" id="authSuccess" hidden></div>

    <form class="auth-form" id="signupForm" novalidate>
      <div class="auth-input-group">
        <label for="displayName">Display Name</label>
        <input type="text" id="displayName" class="auth-input" placeholder="Your name"
               autocomplete="name" required>
      </div>
      <div class="auth-input-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" class="auth-input" placeholder="you@example.com"
               autocomplete="email" required>
      </div>
      <div class="auth-input-group">
        <label for="signupPassword">Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="signupPassword" class="auth-input" placeholder="At least 6 characters"
                 autocomplete="new-password" required minlength="6">
          <button type="button" class="auth-eye" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="auth-input-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="confirmPassword" class="auth-input" placeholder="Repeat your password"
                 autocomplete="new-password" required>
          <button type="button" class="auth-eye" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn" id="signupBtn">
        <span class="auth-btn-label">Create Account</span>
        <span class="auth-spinner" hidden><i class="fa-solid fa-circle-notch fa-spin"></i></span>
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button class="auth-btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-link-row">
      Already have an account? <a href="login.html">Sign in</a>
    </p>

  </div>
</div>

<script type="module">
  import { registerWithEmail, loginWithGoogle, auth, onAuthStateChanged, friendlyError } from './auth.js';

  onAuthStateChanged(auth, user => {
    if (user) window.location.replace('index.html');
  });

  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.hidden = false;
    document.getElementById('authSuccess').hidden = true;
  }
  function showSuccess(msg) {
    const el = document.getElementById('authSuccess');
    el.textContent = msg;
    el.hidden = false;
    document.getElementById('authError').hidden = true;
  }
  function clearAlerts() {
    document.getElementById('authError').hidden = true;
    document.getElementById('authSuccess').hidden = true;
  }
  function setLoading(on) {
    const btn = document.getElementById('signupBtn');
    btn.disabled = on;
    btn.querySelector('.auth-btn-label').hidden = on;
    btn.querySelector('.auth-spinner').hidden  = !on;
    document.getElementById('googleBtn').disabled = on;
  }

  // Toggle password visibility for both fields
  document.querySelectorAll('.auth-eye').forEach(btn => {
    btn.addEventListener('click', function () {
      const inp  = this.parentElement.querySelector('input');
      const icon = this.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    });
  });

  document.getElementById('signupForm').addEventListener('submit', async e => {
    e.preventDefault();
    clearAlerts();
    const name    = document.getElementById('displayName').value.trim();
    const email   = document.getElementById('signupEmail').value.trim();
    const pass    = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!name)            { showError('Please enter a display name.'); return; }
    if (!email)           { showError('Please enter your email.'); return; }
    if (pass.length < 6)  { showError('Password must be at least 6 characters.'); return; }
    if (pass !== confirm)  { showError('Passwords do not match.'); return; }

    setLoading(true);
    try {
      await registerWithEmail(email, pass, name);
      showSuccess('Account created! Redirecting…');
      setTimeout(() => window.location.replace('index.html'), 1200);
    } catch (err) {
      showError(friendlyError(err.code));
      setLoading(false);
    }
  });

  document.getElementById('googleBtn').addEventListener('click', async () => {
    clearAlerts();
    setLoading(true);
    try {
      await loginWithGoogle();
      window.location.replace('index.html');
    } catch (err) {
      showError(friendlyError(err.code));
      setLoading(false);
    }
  });
</script>
</body>
</html>
