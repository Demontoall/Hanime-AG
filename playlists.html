<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Organize your favourite Hanime AG titles into playlists.">
  <title>Playlists — Hanime AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" role="banner">
    <a href="account.html" class="back-btn" aria-label="Back to account"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>Playlists</h2>
    <a href="account.html" class="profile-btn" aria-label="My account"><i class="fa-solid fa-circle-user"></i></a>
  </header>
  <main class="page-content" role="main">
    <h1><i class="fa-solid fa-list" style="color:var(--accent);margin-right:10px;font-size:20px"></i>My Playlists</h1>
    <div id="loadingState" class="empty-state"><i class="fa-solid fa-circle-notch fa-spin" style="color:var(--accent)"></i></div>
    <div id="authGate" class="empty-state" hidden>
      <i class="fa-solid fa-list"></i><h3>Sign in to create playlists</h3>
      <p>Build collections of titles you want to watch next.</p>
      <div class="auth-cta-btns" style="margin-top:20px;justify-content:center">
        <a href="login.html?returnTo=playlists.html" class="auth-btn-cta"><i class="fa-solid fa-right-to-bracket"></i> Sign In</a>
        <a href="signup.html" class="auth-btn-cta auth-btn-cta-outline"><i class="fa-solid fa-user-plus"></i> Create Account</a>
      </div>
    </div>
    <section id="playlistApp" hidden>
      <div class="settings-card playlist-create-card">
        <h3>Create a playlist</h3>
        <p>Keep a personal queue for your next binge.</p>
        <form id="createPlaylistForm" class="playlist-form">
          <label>Name <input id="newPlaylistName" required maxlength="60" placeholder="Weekend watchlist"></label>
          <label>Description <textarea id="newPlaylistDescription" maxlength="160" placeholder="Optional note"></textarea></label>
          <div class="form-actions"><button class="auth-btn-cta" type="submit"><i class="fa-solid fa-plus"></i> Create Playlist</button><span id="playlistMessage" class="form-message" role="status"></span></div>
        </form>
      </div>
      <div id="playlistList" class="playlist-list"></div>
      <div id="emptyPlaylists" class="empty-state" hidden><i class="fa-solid fa-list"></i><h3>No playlists yet</h3><p>Create one above, then add titles from any content card.</p></div>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="footer.js"></script>
  <script type="module" src="auth-ui.js"></script>
  <script type="module" src="playlists.js"></script>
</body>
</html>
