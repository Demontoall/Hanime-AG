<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anime wallpapers and artwork gallery on Hanime AG.">
  <title>Gallery — Hanime AG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar" role="banner">
  <a href="index.html" class="back-btn" aria-label="Back to home">
    <i class="fa-solid fa-arrow-left"></i>
  </a>
  <div class="search-box" role="search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Search gallery…" aria-label="Search gallery">
  </div>
  <a href="account.html" class="profile-btn" aria-label="My account">
    <i class="fa-solid fa-circle-user"></i>
  </a>
</header>

<main class="page-content" role="main">
  <h1><i class="fa-solid fa-images" style="color:var(--accent);margin-right:10px;font-size:20px"></i>Gallery</h1>
  <div class="movie-grid">

    <!-- Using real MAL covers as gallery art -->
    <div class="movie-card">
      <div class="card-thumb">
        <img data-anime="solo-leveling" src="https://picsum.photos/seed/sl2024/300/420" alt="Solo Leveling" loading="lazy">
        <div class="card-play-overlay"><i class="fa-solid fa-expand"></i></div>
      </div>
      <h3>Solo Leveling</h3>
    </div>

    <div class="movie-card">
      <div class="card-thumb">
        <img data-anime="demon-slayer" src="https://picsum.photos/seed/demonslayer/300/420" alt="Demon Slayer" loading="lazy">
        <div class="card-play-overlay"><i class="fa-solid fa-expand"></i></div>
      </div>
      <h3>Demon Slayer</h3>
    </div>

    <div class="movie-card">
      <div class="card-thumb">
        <img data-anime="attack-on-titan" src="https://picsum.photos/seed/aot2024/300/420" alt="Attack on Titan" loading="lazy">
        <div class="card-play-overlay"><i class="fa-solid fa-expand"></i></div>
      </div>
      <h3>Attack on Titan</h3>
    </div>

    <div class="movie-card">
      <div class="card-thumb">
        <img data-anime="your-name" src="https://picsum.photos/seed/yourname2016/300/420" alt="Your Name" loading="lazy">
        <div class="card-play-overlay"><i class="fa-solid fa-expand"></i></div>
      </div>
      <h3>Your Name</h3>
    </div>

    <div class="movie-card">
      <div class="card-thumb">
        <img data-anime="spirited-away" src="https://picsum.photos/seed/spiritedaway/300/420" alt="Spirited Away" loading="lazy">
        <div class="card-play-overlay"><i class="fa-solid fa-expand"></i></div>
      </div>
      <h3>Spirited Away</h3>
    </div>

    <div class="movie-card">
      <div class="card-thumb">
        <img data-anime="vinland-saga" src="https://picsum.photos/seed/vinland/300/420" alt="Vinland Saga" loading="lazy">
        <div class="card-play-overlay"><i class="fa-solid fa-expand"></i></div>
      </div>
      <h3>Vinland Saga</h3>
    </div>

    <div class="movie-card">
      <div class="card-thumb">
        <img data-anime="princess-mononoke" src="https://picsum.photos/seed/mononoke/300/420" alt="Princess Mononoke" loading="lazy">
        <div class="card-play-overlay"><i class="fa-solid fa-expand"></i></div>
      </div>
      <h3>Princess Mononoke</h3>
    </div>

    <div class="movie-card">
      <div class="card-thumb">
        <img data-anime="chainsaw-man" src="https://picsum.photos/seed/chainsawman/300/420" alt="Chainsaw Man" loading="lazy">
        <div class="card-play-overlay"><i class="fa-solid fa-expand"></i></div>
      </div>
      <h3>Chainsaw Man</h3>
    </div>

  </div>
</main>

<script src="app.js"></script>
<script src="anime-images.js"></script>
</body>
</html>
